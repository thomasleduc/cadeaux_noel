<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - muted teal -->
  <rect width="64" height="64" fill="#4A9B9B" rx="6"/>
  
  <!-- Santa's head/face -->
  <ellipse cx="32" cy="38" rx="14" ry="16" fill="#FFDBAC"/>
  
  <!-- Eyes -->
  <circle cx="26" cy="34" r="2.5" fill="#5C4033"/>
  <circle cx="38" cy="34" r="2.5" fill="#5C4033"/>
  
  <!-- Nose -->
  <ellipse cx="32" cy="38" rx="3" ry="3.5" fill="#FFB6C1"/>
  
  <!-- Cheeks -->
  <circle cx="22" cy="38" r="3" fill="#FFB6C1" opacity="0.7"/>
  <circle cx="42" cy="38" r="3" fill="#FFB6C1" opacity="0.7"/>
  
  <!-- Mustache -->
  <path d="M 24 40 Q 32 42 40 40" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 24 42 Q 32 44 40 42" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 24 44 Q 32 46 40 44" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Beard -->
  <ellipse cx="32" cy="48" rx="12" ry="10" fill="#FFFFFF"/>
  <ellipse cx="32" cy="50" rx="10" ry="8" fill="#FFFFFF"/>
  
  <!-- Hat -->
  <path d="M 20 24 L 32 16 L 44 24 L 44 28 L 20 28 Z" fill="#DC143C"/>
  <rect x="20" y="28" width="24" height="4" fill="#FFFFFF"/>
  <circle cx="44" cy="24" r="3.5" fill="#FFFFFF"/>
  
  <!-- Sign with rounded corners -->
  <rect x="16" y="52" width="32" height="10" rx="2" fill="#F5F5DC" stroke="#8B4513" stroke-width="1"/>
  <text x="32" y="58" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="#8B4513" text-anchor="middle" dominant-baseline="middle">SECRET</text>
  <text x="32" y="63" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="#8B4513" text-anchor="middle" dominant-baseline="middle">SANTA</text>
</svg>
